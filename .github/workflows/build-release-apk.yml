name: Build and Publish NeonVFX Studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Full 16K 3D APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore from debug.keystore.base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Robolectric & Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release Artifacts (APK + Offline WebApp)
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/NeonVFX_Studio_Full_16K_3D.apk
          cp public/index.html release-artifacts/NeonVFX_Studio_Offline_WebApp.html

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeonVFX_Studio_Full_16K_3D_Bundle
          path: |
            release-artifacts/NeonVFX_Studio_Full_16K_3D.apk
            release-artifacts/NeonVFX_Studio_Offline_WebApp.html
          retention-days: 90

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: NeonVFX Studio 3D (APK + Offline WebApp)
          body: |
            Automated build for **NeonVFX Studio** (`com.aistudio.neonvfx.mrxkzt`).
            - Android APK: `NeonVFX_Studio_Full_16K_3D.apk`
            - 100% Offline PC & Mobile WebApp: `NeonVFX_Studio_Offline_WebApp.html`
          files: |
            release-artifacts/NeonVFX_Studio_Full_16K_3D.apk
            release-artifacts/NeonVFX_Studio_Offline_WebApp.html
